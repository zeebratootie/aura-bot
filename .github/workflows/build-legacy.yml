name: Build & Release (Legacy)

on:
  push:
    branches: [legacy]
    tags: ["v*-legacy"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-legacy-linux-${{ github.sha }}
          restore-keys: ccache-legacy-linux-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ccache \
            libgmp3-dev libbz2-dev zlib1g-dev

      - name: Build bncsutil
        run: |
          export CXX="ccache g++"
          export CC="ccache gcc"
          cd bncsutil/src/bncsutil
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build StormLib
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          cd StormLib
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=1 ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build aura++ (legacy)
        run: |
          export CXX="ccache g++"
          export CC="ccache gcc"
          # GCC 13+ no longer leaks <cstdint> types through system headers
          sed -i '/^CXXFLAGS = /s/$/ -include cstdint/' Makefile
          make -j$(nproc)
          ccache -s

      - name: Package tarball
        run: |
          mkdir -p /tmp/aura-legacy-pkg
          cp aura++                          /tmp/aura-legacy-pkg/
          cp /usr/local/lib/libstorm.so      /tmp/aura-legacy-pkg/
          cp /usr/lib/libbncsutil.so         /tmp/aura-legacy-pkg/
          tar -czf aura-legacy-linux-x64.tar.gz -C /tmp/aura-legacy-pkg .
          echo "Tarball contents:"
          tar -tzf aura-legacy-linux-x64.tar.gz
          ls -lh aura-legacy-linux-x64.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-legacy-linux-x64
          path: aura-legacy-linux-x64.tar.gz
          retention-days: 30

      - name: Update rolling latest-legacy release (Linux)
        if: github.ref == 'refs/heads/legacy'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-legacy
          name: Latest build — legacy (sfarmani fork)
          prerelease: true
          files: aura-legacy-linux-x64.tar.gz
          body: |
            Automated build from the latest `legacy` branch (sfarmani/aura-bot fork).

            C++17, binary name `aura++`. Spoofcheck disabled — all players pre-verified at join.

            | File | Platform |
            |------|----------|
            | `aura-legacy-linux-x64.tar.gz` | Ubuntu 22.04 / 24.04 (x86-64) |
            | `aura-legacy-macos-arm64.tar.gz` | macOS 14+ Apple Silicon (M1/M2/M3) |

            ### Fast VPS install (Linux)
            ```bash
            curl -fsSL https://gist.githubusercontent.com/zeebratootie/3e6e557456620d2407b4872d63fa2bfe/raw/download-gist.sh | bash
            AURA_RELEASE_URL='https://github.com/zeebratootie/aura-bot/releases/download/latest-legacy/aura-legacy-linux-x64.tar.gz' \
              ./setup-vps-hostbot.sh 'admins' botuser 'password' BotName
            ```

            ### What's included
            - `aura++` — the host bot binary
            - `libstorm.so` / `libstorm.dylib` — StormLib (Linux: shared; macOS: static in binary)
            - `libbncsutil.so` — BNCSUtil (Linux only; static-linked on macOS)

      - name: Create versioned legacy release (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-legacy')
        uses: softprops/action-gh-release@v2
        with:
          files: aura-legacy-linux-x64.tar.gz

  build-macos:
    name: macOS ARM64
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install gmp cmake

      - name: Build bncsutil (real static archive on macOS)
        run: |
          BREW=$(brew --prefix)
          NCPU=$(sysctl -n hw.logicalcpu)
          cd bncsutil/src/bncsutil
          # Compile objects — skip the bncsutil Makefile's link step (it creates a dylib-as-.a
          # which needs gmp at link time; we bake gmp into aura++ directly instead)
          clang++ -std=c++11 -O3 -I ../ -Wno-multichar -fPIC -c \
            bsha1.cpp cdkeydecoder.cpp checkrevision.cpp decodekey.cpp \
            file.cpp libinfo.cpp oldauth.cpp
          clang -std=c99  -O3 -I ../ -Wno-multichar -fPIC -c \
            nls.c pe.c sha1.c stack.c debug.c
          ar rcs libbncsutil.a *.o
          sudo mkdir -p /usr/local/include/bncsutil
          sudo cp *.h /usr/local/include/bncsutil/
          sudo cp libbncsutil.a /usr/local/lib/

      - name: Build StormLib (static on macOS)
        run: |
          cd StormLib
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=0 ..
          make -j$(sysctl -n hw.logicalcpu)
          sudo make install

      - name: Build aura++ (macOS)
        run: |
          BREW=$(brew --prefix)
          NCPU=$(sysctl -n hw.logicalcpu)
          # All deps are static — binary has no external lib dependencies
          make -j$NCPU \
            "CXXFLAGS = -std=c++17 -O3 -pipe -fno-rtti -include cstdint -stdlib=libc++ -D__APPLE__ -I. -Ibncsutil/src/ -IStormLib/src/ -I$BREW/include" \
            "LFLAGS = /usr/local/lib/libbncsutil.a /usr/local/lib/libStormLib.a $BREW/lib/libgmp.a -lbz2 -lz -lc++"

      - name: Package tarball (macOS)
        run: |
          mkdir -p /tmp/aura-legacy-macos
          cp aura++ /tmp/aura-legacy-macos/
          strip /tmp/aura-legacy-macos/aura++
          tar -czf aura-legacy-macos-arm64.tar.gz -C /tmp/aura-legacy-macos .
          echo "Tarball contents:"
          tar -tzf aura-legacy-macos-arm64.tar.gz
          ls -lh aura-legacy-macos-arm64.tar.gz
          echo "Binary deps:"
          otool -L /tmp/aura-legacy-macos/aura++

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-legacy-macos-arm64
          path: aura-legacy-macos-arm64.tar.gz
          retention-days: 30

      - name: Update rolling latest-legacy release (macOS)
        if: github.ref == 'refs/heads/legacy'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-legacy
          name: Latest build — legacy (sfarmani fork)
          prerelease: true
          files: aura-legacy-macos-arm64.tar.gz

      - name: Create versioned legacy release (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-legacy')
        uses: softprops/action-gh-release@v2
        with:
          files: aura-legacy-macos-arm64.tar.gz
